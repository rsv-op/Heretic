name: Build Unified HeretIc APK

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Native Heretic Voice Assistant APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shallow checkout llama.cpp for JNI build
        run: |
          rm -rf public/android/HeretIc/app/src/main/cpp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git public/android/HeretIc/app/src/main/cpp/llama.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android NDK r27 & CMake 3.22.1
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ] || [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | "$SDKM" --licenses >/dev/null || true
            "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1"
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Assemble Native Voice Assistant APK
        working-directory: public/android/HeretIc
        run: |
          set -o pipefail
          (gradle :app:testDebugUnitTest --no-daemon --stacktrace && gradle :app:assembleDebug --no-daemon --stacktrace) 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/debug/app-debug.apk ../../../Heretic-Voice-Assistant.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../../HeretIc.apk

      - name: Verify pure native APK (no WebUI) and ARM64 JNI libraries
        working-directory: public/android/HeretIc
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > "$RUNNER_TEMP/apk.txt"
          fail=0
          for needle in \
            "assets/silero_vad.onnx" \
            "lib/arm64-v8a/liblitertlm" \
            "lib/arm64-v8a/libllama_jni.so" \
            "lib/arm64-v8a/libonnxruntime.so"; do
            if grep -q "$needle" "$RUNNER_TEMP/apk.txt"; then
              echo "ok: $needle"
            else
              echo "::error title=APK content missing::$needle is not packaged in $APK"
              fail=1
            fi
          done
          if grep -q "assets/index.html" "$RUNNER_TEMP/apk.txt" || grep -q "assets/pglite-" "$RUNNER_TEMP/apk.txt"; then
            echo "::error title=WebUI packaged unexpectedly::Final APK must be pure native Jetpack Compose without assets/index.html"
            fail=1
          fi
          if grep -q "lib/x86_64/" "$RUNNER_TEMP/apk.txt" || grep -q "lib/armeabi-v7a/" "$RUNNER_TEMP/apk.txt"; then
            echo "::error title=Unexpected ABI packaged::APK must contain arm64-v8a native libraries exclusively"
            fail=1
          fi
          exit $fail

      - name: Publish build report (readable via API)
        if: success()
        working-directory: public/android/HeretIc
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          suites = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              suites.append(root.get("name", os.path.basename(path)))
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          size = os.path.getsize(apk) if os.path.exists(apk) else 0
          listing = subprocess.run(["unzip", "-l", apk], capture_output=True, text=True).stdout
          assets = [line.split()[-1] for line in listing.splitlines() if "assets/" in line]
          native_libs = sorted([line.split()[-1] for line in listing.splitlines() if line.strip().endswith(".so")])
          native_abis = sorted({p.split("/")[1] for p in native_libs if "/" in p})
          def note(title, text):
              text = str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", " ")[:900]
              print(f"::notice title={title}::{text}")
          note("Unit tests", f"{total} run, {failures} failures, {errors} errors, {skipped} skipped | suites: {', '.join(suites)}")
          note("APK", f"{size} bytes ({size/1048576:.2f} MiB) | native ABIs: {', '.join(native_abis)} | libs: {', '.join(os.path.basename(p) for p in native_libs)}")
          note("APK assets", ", ".join(a.split("assets/")[-1] for a in assets) or "no asset entries found")
          PY

      - name: Publish Gradle errors (readable via API)
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/gradle.log" <<'PY'
          import sys, re
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          keep = [l for l in lines if re.search(r"^e: |error|What went wrong|Could not|FAILED|Exception|Caused by|^> ", l)]
          for i, l in enumerate(lines):
              if re.search(r"issues were found|compile against|minCompileSdk|requires", l):
                  keep += lines[i:i + 12]
          msg = "\n".join(keep[:90]) or "\n".join(lines[-60:])
          msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3500]
          print(f"::error title=Gradle build failed::{msg}")
          PY

      - name: Upload Downloadable Heretic-Voice-Assistant.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heretic-Voice-Assistant-apk
          path: |
            Heretic-Voice-Assistant.apk
            HeretIc.apk
          retention-days: 30

  publish-release:
    name: Publish Native Voice Assistant APK to GitHub Releases
    needs: build-apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Heretic-Voice-Assistant-apk

      - name: Create GitHub Release with Heretic-Voice-Assistant.apk attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="heretic-voice-assistant-v3.${{ github.run_number }}"
          if ! gh release create "$TAG" Heretic-Voice-Assistant.apk HeretIc.apk \
            --title "Heretic Voice Assistant Final Native APK (v3.${{ github.run_number }})" \
            --notes "Pure Native Jetpack Compose **Heretic Voice Assistant** Android 16 ARM64 APK (zero WebView/WebUI). Includes built-in Silero VAD v6, out-of-the-box offline voice command execution across all 6 Heretic workflows (Assistant, Error Loop, File Assessor, Repo Milestones, SHA-256 Authorization Gates, and ADR Decision Log), plus modular neural activation for Parakeet TDT STT, llama.cpp JNI GGUF, LiteRT-LM, and Supertonic ONNX TTS with instant \`shaz\` / VAD AudioTrack barge-in. Built from commit ${{ github.sha }}." \
            --latest 2> release.err; then
            cat release.err
            echo "::error title=Release failed::$(tr '\n' ' ' < release.err | cut -c1-900)"
            exit 1
          fi
