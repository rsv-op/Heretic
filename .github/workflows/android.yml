name: Build Unified HeretIc APK

on:
  push:
    branches:
      - main
      - arena/150cc900-heretic
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Bundle Web UI & Assemble HeretIc APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build single-file web UI and copy to Android assets
        working-directory: webui
        run: |
          npm ci
          npm run typecheck
          npm run build
          # index.html plus the split PGlite runtime (wasm + data), served by
          # WebViewAssetLoader from https://appassets.androidplatform.net/assets/
          rm -f ../public/android/HeretIc/app/src/main/assets/*.js \
                ../public/android/HeretIc/app/src/main/assets/*.wasm \
                ../public/android/HeretIc/app/src/main/assets/*.data
          cp dist/* ../public/android/HeretIc/app/src/main/assets/
          ls -la ../public/android/HeretIc/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Assemble APK
        working-directory: public/android/HeretIc
        run: |
          set -o pipefail
          (gradle :app:testDebugUnitTest --no-daemon --stacktrace && gradle :app:assembleDebug --no-daemon --stacktrace) 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/debug/app-debug.apk ../../../HeretIc.apk

      - name: Verify packaged web bundle and LiteRT-LM native libs
        working-directory: public/android/HeretIc
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > "$RUNNER_TEMP/apk.txt"
          fail=0
          for needle in "assets/index.html" "assets/pglite-" "lib/arm64-v8a/liblitertlm" "lib/x86_64/liblitertlm"; do
            if grep -q "$needle" "$RUNNER_TEMP/apk.txt"; then
              echo "ok: $needle"
            else
              echo "::error title=APK content missing::$needle is not packaged in $APK"
              fail=1
            fi
          done
          # 53 MB of base64 wasm in the HTML would mean the split regressed.
          HTML_BYTES=$(unzip -p "$APK" assets/index.html | wc -c)
          echo "index.html inside the APK: $HTML_BYTES bytes"
          if [ "$HTML_BYTES" -gt 4000000 ]; then
            echo "::error title=Web bundle regressed::assets/index.html is $HTML_BYTES bytes; the PGlite runtime is being inlined again"
            fail=1
          fi
          exit $fail

      - name: Publish build report (readable via API)
        if: success()
        working-directory: public/android/HeretIc
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          suites = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              suites.append(root.get("name", os.path.basename(path)))
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          size = os.path.getsize(apk) if os.path.exists(apk) else 0
          listing = subprocess.run(["unzip", "-l", apk], capture_output=True, text=True).stdout
          assets = [line.split()[-1] for line in listing.splitlines() if "/assets/" in line]
          native = sorted({line.split()[-1].split("/")[1] for line in listing.splitlines() if line.strip().endswith(".so")})
          def note(title, text):
              text = str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", " ")[:900]
              print(f"::notice title={title}::{text}")
          note("Unit tests", f"{total} run, {failures} failures, {errors} errors, {skipped} skipped | suites: {', '.join(suites)}")
          note("APK", f"{size} bytes ({size/1048576:.2f} MiB) | native ABIs: {', '.join(native)}")
          note("APK assets", ", ".join(a.split("assets/")[-1] for a in assets) or "no asset entries found")
          PY

      - name: Publish Gradle errors (readable via API)
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/gradle.log" <<'PY'
          import sys, re
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          keep = [l for l in lines if re.search(r"^e: |error|What went wrong|Could not|FAILED|Exception|Caused by|^> ", l)]
          for i, l in enumerate(lines):
              if re.search(r"issues were found|compile against|minCompileSdk|requires", l):
                  keep += lines[i:i + 12]
          msg = "\n".join(keep[:90]) or "\n".join(lines[-60:])
          msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3500]
          print(f"::error title=Gradle build failed::{msg}")
          PY

      - name: Upload Downloadable HeretIc.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeretIc-unified-apk
          path: HeretIc.apk
          retention-days: 30

  publish-release:
    name: Publish APK to GitHub Releases
    needs: build-apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: HeretIc-unified-apk

      - name: Create GitHub Release with the APK attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="apk-run-${{ github.run_number }}"
          if ! gh release create "$TAG" HeretIc.apk \
            --title "HeretIc APK (build ${{ github.run_number }})" \
            --notes "Built from commit ${{ github.sha }} by workflow run ${{ github.run_id }}. Debug-signed: allow 'Install unknown apps' on Android to sideload." \
            --latest 2> release.err; then
            cat release.err
            echo "::error title=Release failed::$(tr '\n' ' ' < release.err | cut -c1-900)"
            exit 1
          fi
